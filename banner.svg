<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .blob1 { fill: #a78bfa; }
      .blob2 { fill: #67e8f9; }
      .blob3 { fill: #f0abfc; }
      .panel { fill: rgba(0,0,0,0.035); stroke: rgba(0,0,0,0.09); }
      .code-key { fill: #cf222e; font-weight: 600; }
      .code-str { fill: #0a3069; }
      .code-punc { fill: #24292f; }
      .code-prop { fill: #953800; }
      .code-com { fill: #6e7781; font-style: italic; }
      .cursor { fill: #24292f; }
      .title { fill: #0969da; font-weight: 700; }
      .subtitle { fill: #57606a; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .blob1 { fill: #7c3aed; }
        .blob2 { fill: #0891b2; }
        .blob3 { fill: #a21caf; }
        .panel { fill: rgba(255,255,255,0.045); stroke: rgba(255,255,255,0.14); }
        .code-key { fill: #ff7b72; font-weight: 600; }
        .code-str { fill: #a5d6ff; }
        .code-punc { fill: #c9d1d9; }
        .code-prop { fill: #79c0ff; }
        .code-com { fill: #8b949e; font-style: italic; }
        .cursor { fill: #58a6ff; }
        .title { fill: #58a6ff; font-weight: 700; }
        .subtitle { fill: #8b949e; }
      }

      .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; font-size: 17px; }
      .heading { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>

    <filter id="glassBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18" />
    </filter>

    <clipPath id="frameClip">
      <rect x="0" y="0" width="1000" height="300" rx="24" />
    </clipPath>

    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="220">
        <animate attributeName="width" from="0" to="480" begin="0.3s" dur="2.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect class="bg" width="1000" height="300" />

    <!-- floating glass blobs -->
    <g filter="url(#glassBlur)">
      <circle class="blob1" cx="120" cy="60" r="90" opacity="0.55">
        <animate attributeName="cx" values="120;180;120" dur="9s" repeatCount="indefinite" />
        <animate attributeName="cy" values="60;110;60" dur="11s" repeatCount="indefinite" />
      </circle>
      <circle class="blob2" cx="880" cy="230" r="110" opacity="0.5">
        <animate attributeName="cx" values="880;800;880" dur="10s" repeatCount="indefinite" />
        <animate attributeName="cy" values="230;170;230" dur="8s" repeatCount="indefinite" />
      </circle>
      <circle class="blob3" cx="850" cy="40" r="70" opacity="0.4">
        <animate attributeName="cx" values="850;790;850" dur="7s" repeatCount="indefinite" />
        <animate attributeName="cy" values="40;90;40" dur="9.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- glass panel -->
    <rect class="panel" x="40" y="40" width="920" height="220" rx="20" stroke-width="1" filter="url(#softShadow)" />

    <!-- terminal dots -->
    <circle cx="66" cy="66" r="6" fill="#ff5f56" />
    <circle cx="86" cy="66" r="6" fill="#ffbd2e" />
    <circle cx="106" cy="66" r="6" fill="#27c93f" />

    <!-- typing code block, revealed via clip-path -->
    <g clip-path="url(#typeClip)" transform="translate(64, 110)">
      <text class="mono">
        <tspan x="0" y="0"><tspan class="code-key">const</tspan><tspan class="code-punc"> developer = {</tspan></tspan>
        <tspan x="24" y="30"><tspan class="code-prop">name</tspan><tspan class="code-punc">: </tspan><tspan class="code-str">'Your Name'</tspan><tspan class="code-punc">,</tspan></tspan>
        <tspan x="24" y="60"><tspan class="code-prop">role</tspan><tspan class="code-punc">: </tspan><tspan class="code-str">'Full-Stack Developer'</tspan><tspan class="code-punc">,</tspan></tspan>
        <tspan x="24" y="90"><tspan class="code-prop">stack</tspan><tspan class="code-punc">: [</tspan><tspan class="code-str">'TypeScript'</tspan><tspan class="code-punc">, </tspan><tspan class="code-str">'React'</tspan><tspan class="code-punc">, </tspan><tspan class="code-str">'Node'</tspan><tspan class="code-punc">],</tspan></tspan>
        <tspan x="24" y="120"><tspan class="code-com">// always building something</tspan></tspan>
        <tspan x="24" y="150"><tspan class="code-prop">currentlyLearning</tspan><tspan class="code-punc">: </tspan><tspan class="code-str">'Rust'</tspan></tspan>
        <tspan x="0" y="180"><tspan class="code-punc">};</tspan></tspan>
      </text>
    </g>

    <!-- blinking cursor, appears after typing finishes -->
    <rect class="cursor" x="520" y="200" width="11" height="20" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.11;0.12;0.5;0.51;1" dur="1.2s" begin="2.9s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
